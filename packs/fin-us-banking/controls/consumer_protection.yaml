# yaml-language-server: $schema=https://raw.githubusercontent.com/abiroland/ai-mrg-framework/main/schemas/pack-controls.schema.json
controls:
  - id: FIN-CPR-001
    title: Specific and accurate adverse-action reasons
    objective: >
      Derive the principal reasons for adverse action from the factors the model actually
      scored, and confirm they are specific and accurate rather than the nearest generic
      sample-form reason.
    lifecycle_stage: validation
    applies_when: '"credit_decision" in uses'
    frequency: at_validation
    evidence_required: [check_result, document]
    checks:
      - id: adverse_action.reason_mapping
      - id: adverse_action.reason_specificity
    references:
      - { source: ECOA-REGB, section: 12 CFR 1002.9 }
      - { source: CFPB-2022-03 }
      - { source: CFPB-2023-03 }
      - { source: NIST-AI-RMF-1.0, section: MEASURE 2.9 }
    guidance: >
      The complexity or opacity of a model does not relieve the creditor of this obligation.
      Map engineered and non-traditional variables to reasons a consumer can understand.

  - id: FIN-CPR-002
    title: Fair-lending disparate-impact testing
    objective: >
      Test outcomes for disparities across protected classes (using a documented proxy
      method where class data are unavailable) and document any search for less
      discriminatory alternatives.
    lifecycle_stage: validation
    applies_when: '"credit_decision" in uses'
    frequency: at_validation
    evidence_required: [check_result, document]
    checks:
      - id: fairness.adverse_impact_ratio
      - id: fairness.standardized_mean_difference
    references:
      - { source: ECOA-REGB }
      - { source: FHA, section: Where the credit is residential real estate-related }
      - { source: NIST-AI-RMF-1.0, section: MEASURE 2.11 }
    guidance: >
      Screening metrics are a starting point, not a legal conclusion. Involve fair-lending
      counsel in interpreting results.

  - id: FIN-CPR-003
    title: Ongoing fair-lending monitoring
    objective: Repeat disparity testing on production decisions.
    lifecycle_stage: monitoring
    applies_when: '"credit_decision" in uses and tier <= 3'
    frequency: annually
    evidence_required: [check_result]
    checks:
      - id: fairness.adverse_impact_ratio
    references:
      - { source: ECOA-REGB }
      - { source: NIST-AI-RMF-1.0, section: MEASURE 2.11 }

  - id: FIN-CPR-004
    title: Consumer-report adverse-action disclosures
    objective: >
      When a consumer report contributed to the decision, include the disclosures FCRA
      requires in the adverse-action notice.
    lifecycle_stage: implementation
    applies_when: '"credit_decision" in uses'
    frequency: on_change
    evidence_required: [document]
    references:
      - { source: FCRA, section: 15 U.S.C. 1681m }

  - id: FIN-CPR-005
    title: Colorado pre-use notice for covered ADMT
    objective: >
      Before a covered automated decision-making technology is used for a consequential
      decision about a Colorado consumer, give clear and conspicuous notice that it is used,
      how to get more information about it, and the consumer's rights.
    lifecycle_stage: implementation
    applies_when: consequential_decision and "US-CO" in jurisdictions
    frequency: on_change
    evidence_required: [document, attestation]
    references:
      - { source: CO-SB26-189, section: Deployer notice }
    guidance: >
      Effective 2027-01-01. The Attorney General may adopt rules on these disclosures;
      verify against the enacted text, any rules, and pending litigation. A draft notice
      can be generated with `aimrg report render colorado_admt_notices`.

  - id: FIN-CPR-006
    title: Colorado post-adverse-outcome disclosure (within 30 days)
    objective: >
      When a covered ADMT materially influences a consequential decision with an adverse
      outcome, provide within 30 days a plain-language description of the decision and
      the role the ADMT played, and how to request more information and exercise rights.
    lifecycle_stage: implementation
    applies_when: consequential_decision and "US-CO" in jurisdictions
    frequency: on_change
    evidence_required: [document, attestation]
    references:
      - { source: CO-SB26-189, section: Post-adverse-outcome disclosure }
    guidance: >
      For credit decisions, coordinate with the ECOA/Regulation B adverse-action notice
      (FIN-CPR-001) so the two disclosures are consistent.

  - id: FIN-CPR-007
    title: Colorado data correction and human review process
    objective: >
      After an adverse outcome, let consumers request correction of inaccurate personal
      data the ADMT used and request meaningful human review and reconsideration of the
      decision, to the extent the law requires.
    lifecycle_stage: implementation
    applies_when: consequential_decision and "US-CO" in jurisdictions
    frequency: on_change
    evidence_required: [document, attestation]
    references:
      - { source: CO-SB26-189, section: Consumer rights after an adverse outcome }
      - { source: NIST-AI-RMF-1.0, section: MANAGE 4.1 }

  - id: FIN-CPR-008
    title: Colorado record retention for ADMT decisions
    objective: >
      Retain records showing how notices were given and how covered ADMT decisions and
      requests were handled, for the period the law requires.
    lifecycle_stage: monitoring
    applies_when: consequential_decision and "US-CO" in jurisdictions
    frequency: annually
    evidence_required: [attestation]
    references:
      - { source: CO-SB26-189, section: Record retention }
