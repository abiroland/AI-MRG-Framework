[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-mrg"
dynamic = ["version"]
description = "Open-source, full-lifecycle AI and model risk governance toolkit for U.S. regulated industries."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "AI-MRG Framework contributors" }]
keywords = [
  "model risk management",
  "AI governance",
  "SR 26-2",
  "fair lending",
  "adverse action",
  "NIST AI RMF",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "click>=8.1",
  "numpy>=1.26",
  "pandas>=2.1",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "ai-mrg[docx,api,postgres]",
  "httpx>=0.27",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "pandas-stubs",
  "jsonschema>=4.21",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[project.scripts]
aimrg = "aimrg.cli:main"

[project.urls]
Homepage = "https://github.com/abiroland/ai-mrg-framework"
Documentation = "https://abiroland.github.io/ai-mrg-framework/"
Issues = "https://github.com/abiroland/ai-mrg-framework/issues"
Changelog = "https://github.com/abiroland/ai-mrg-framework/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/aimrg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aimrg"]

# Ship the built-in content packs inside the wheel as aimrg/_packs/<name>.
[tool.hatch.build.targets.wheel.force-include]
"packs" = "aimrg/_packs"

[tool.hatch.build.targets.sdist]
include = ["src", "packs", "schemas", "tests", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

# --- Tooling -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docx", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rfE --strict-markers"

[tool.coverage.run]
source = ["aimrg"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
