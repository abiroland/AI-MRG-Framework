name: Bug report
description: Something in the code doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or code you ran and the full error. Do not include real customer data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AI-MRG version (`aimrg --version`)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
