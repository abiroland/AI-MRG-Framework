name: Release

# Publish to PyPI when a GitHub release is published (tag e.g. v0.3.0).
# Uses PyPI trusted publishing: no API token is stored in GitHub. Configure the pending
# publisher on pypi.org with workflow "release.yml" and environment "pypi".
#
# Every release also gets:
#   * SLSA build-provenance attestations for the wheel and sdist (verify with
#     `gh attestation verify <file> --repo abiroland/AI-MRG-Framework`);
#   * PyPI attestations (PEP 740), produced by the publish action;
#   * a CycloneDX SBOM and SHA256SUMS attached to the GitHub release.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/aimrg/__init__.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "package $version, tag $tag"
          test "$version" = "$tag"
      - run: pip install build
      - run: python -m build
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/env
          /tmp/env/bin/pip install "$(ls dist/*.whl)[docx]"
          cd /tmp && /tmp/env/bin/aimrg --version && /tmp/env/bin/aimrg pack validate fin-us-banking
      - name: SBOM (CycloneDX) and checksums
        run: |
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install "$(ls dist/*.whl)[all]"
          pip install cyclonedx-bom
          mkdir -p release-assets
          cyclonedx-py environment /tmp/sbomenv --output-format JSON \
            --output-file "release-assets/ai-mrg-${GITHUB_REF_NAME#v}.cdx.json"
          (cd dist && sha256sum *) > release-assets/SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-mrg
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets/
      - name: Attach SBOM and checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
